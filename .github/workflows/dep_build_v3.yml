name: Re-build on jackson-databind v3 push
on:
  repository_dispatch:
    types: [jackson-databind-pushed-v3]
  # just for testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Do we want wide matrix build? For now, limited
    runs-on: 'ubuntu-22.04'
    strategy:
      fail-fast: false
      matrix:
        # 17, 21: all modules except Blackbird (profile-gated to JDK 25+).
        # 25: only the Blackbird modules, which the other two leave out.
        java_version: ['17', '21', '25']
    env:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: 3.x
    # Blackbird builds only on JDK 25+, but its jar must run on 17-24 too
    # (module discovery skips it there); blackbird-tests starts those JDKs.
    # Keep in sync with main.yml.
    - name: Set up older JDKs for Blackbird runtime tests
      if: ${{ matrix.java_version == '25' }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: |
          17
          21
    - name: Set up JDK
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
    - name: Build and test
      run: |
        BUILD_ARGS=""
        if [ "${{ matrix.java_version }}" = "25" ]; then
          BUILD_ARGS="-pl blackbird,blackbird-tests,blackbird-jpms-tests -am"
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -n "${JAVA_HOME_21_X64:-}" ]; then
            BUILD_ARGS="${BUILD_ARGS} -Dblackbird.test.oldJdks=${JAVA_HOME_17_X64},${JAVA_HOME_21_X64}"
          fi
        fi
        ./mvnw -B -ff -ntp clean verify ${BUILD_ARGS}

# No recursive rebuild (yet?)
